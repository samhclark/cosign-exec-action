name: Version Check

on:
  pull_request:
    branches:
      - main
    paths:
      - action.yml
      - Containerfile
      - build-cosign.sh
      - entrypoint.sh

permissions:
  contents: read

jobs:
  check-version:
    name: Version Check
    runs-on: ubuntu-latest

    if: ${{ github.actor != 'dependabot[bot]' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true

      - name: Check Version
        run: |
          version=$(grep 'image:' action.yml | grep -oP 'v\K[\d.]+[-\w.]*')
          if [ -z "$version" ]; then
            echo "::error::Could not extract version from action.yml"
            exit 1
          fi
          echo "Found version: $version"

          if git tag -l "v$version" | grep -q .; then
            echo "::error::Tag v$version already exists. Bump the version in action.yml."
            exit 1
          fi

          echo "Version v$version is new. Check passed."
